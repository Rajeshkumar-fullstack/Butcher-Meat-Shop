  <!-- Early Theme & RTL Detection to Prevent FOUC -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('primecut_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-bs-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
        if (!sessionStorage.getItem('primecut_ltr_enforced')) {
          sessionStorage.setItem('primecut_ltr_enforced', 'true');
          localStorage.setItem('primecut_direction', 'ltr');
        }
        const savedDir = localStorage.getItem('primecut_direction');
        if (savedDir === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          document.documentElement.setAttribute('lang', 'ar');
        } else {
          document.documentElement.setAttribute('dir', 'ltr');
          document.documentElement.setAttribute('lang', 'en');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Validation Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const regForm = document.getElementById('registerForm');
      const fullName = document.getElementById('regFullName');
      const email = document.getElementById('regEmail');
      const phone = document.getElementById('regPhone');
      const pass = document.getElementById('regPassword');
      const confirmPass = document.getElementById('regConfirmPassword');
      const terms = document.getElementById('termsCheck');

      const nameFeedback = document.getElementById('nameFeedback');
      const emailFeedback = document.getElementById('emailFeedback');
      const phoneFeedback = document.getElementById('phoneFeedback');
      const passFeedback = document.getElementById('passFeedback');
      const confirmFeedback = document.getElementById('confirmFeedback');
      const termsFeedback = document.getElementById('termsFeedback');

      function showFieldError(input, feedbackEl, message) {
        if (input) input.classList.add('is-invalid', 'border-red-500');
        if (feedbackEl) {
          feedbackEl.textContent = message;
          feedbackEl.style.display = 'block';
        }
      }

      function clearFieldError(input, feedbackEl) {
        if (input) input.classList.remove('is-invalid', 'border-red-500');
        if (feedbackEl) {
          feedbackEl.textContent = '';
          feedbackEl.style.display = 'none';
        }
      }

      // --- Real-time restriction & validation for Mobile Phone ---
      if (phone) {
        // Intercept and prevent typing alphabets immediately
        phone.addEventListener('keydown', (e) => {
          if (
            e.key === 'Backspace' ||
            e.key === 'Delete' ||
            e.key === 'Tab' ||
            e.key === 'Escape' ||
            e.key === 'Enter' ||
            e.key.startsWith('Arrow') ||
            e.key === 'Home' ||
            e.key === 'End' ||
            e.ctrlKey ||
            e.metaKey
          ) {
            return;
          }

          if (/^[a-zA-Z]$/.test(e.key)) {
            e.preventDefault();
            showFieldError(phone, phoneFeedback, 'Letters are not allowed in phone number.');
            setTimeout(() => {
              if (phone.value.trim().length >= 7) {
                clearFieldError(phone, phoneFeedback);
              }
            }, 2500);
            return;
          }

          if (!/^[0-9+\-()\s]$/.test(e.key)) {
            e.preventDefault();
            showFieldError(phone, phoneFeedback, 'Only numbers and +, -, (, ) are allowed.');
            setTimeout(() => {
              if (phone.value.trim().length >= 7) {
                clearFieldError(phone, phoneFeedback);
              }
            }, 2500);
          }
        });

        // Strip any pasted/inserted alphabets on input
        phone.addEventListener('input', () => {
          const hadLetters = /[a-zA-Z]/.test(phone.value);
          const cleaned = phone.value.replace(/[^0-9+\-()\s]/g, '');
          if (phone.value !== cleaned) {
            phone.value = cleaned;
          }

          if (hadLetters) {
            showFieldError(phone, phoneFeedback, 'Letters are not allowed in phone number.');
            return;
          }

          const digits = phone.value.replace(/\D/g, '');
          if (phone.value.trim() && digits.length < 7) {
            showFieldError(phone, phoneFeedback, 'Phone number must have at least 7 digits.');
          } else {
            clearFieldError(phone, phoneFeedback);
          }
        });

        phone.addEventListener('paste', (e) => {
          const pastedText = (e.clipboardData || window.clipboardData)?.getData('text') || '';
          if (/[a-zA-Z]/.test(pastedText)) {
            e.preventDefault();
            const cleanText = pastedText.replace(/[^0-9+\-()\s]/g, '');
            const start = phone.selectionStart || 0;
            const end = phone.selectionEnd || 0;
            phone.value = phone.value.substring(0, start) + cleanText + phone.value.substring(end);
            phone.selectionStart = phone.selectionEnd = start + cleanText.length;
            showFieldError(phone, phoneFeedback, 'Letters were removed from pasted phone number.');
            setTimeout(() => {
              if (phone.value.replace(/\D/g, '').length >= 7) {
                clearFieldError(phone, phoneFeedback);
              }
            }, 2500);
          }
        });
      }

      // --- Real-time validation for Full Name ---
      if (fullName) {
        fullName.addEventListener('input', () => {
          const val = fullName.value.trim();
          if (val && /^\d+$/.test(val)) {
            showFieldError(fullName, nameFeedback, 'Full name cannot be numbers only.');
          } else if (val && val.length < 2) {
            showFieldError(fullName, nameFeedback, 'Full name must be at least 2 characters.');
          } else {
            clearFieldError(fullName, nameFeedback);
          }
        });
      }

      // --- Real-time validation for Email ---
      if (email) {
        email.addEventListener('input', () => {
          const val = email.value.trim();
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (val && !emailRegex.test(val)) {
            showFieldError(email, emailFeedback, 'Please enter a valid email address.');
          } else {
            clearFieldError(email, emailFeedback);
          }
        });
      }

      // --- Real-time validation for Passwords ---
      if (pass) {
        pass.addEventListener('input', () => {
          if (pass.value.length > 0 && pass.value.length < 8) {
            showFieldError(pass, passFeedback, 'Password must be at least 8 characters.');
          } else {
            clearFieldError(pass, passFeedback);
          }
          if (confirmPass && confirmPass.value.length > 0) {
            if (pass.value !== confirmPass.value) {
              showFieldError(confirmPass, confirmFeedback, 'Passwords do not match.');
            } else {
              clearFieldError(confirmPass, confirmFeedback);
            }
          }
        });
      }

      if (confirmPass) {
        confirmPass.addEventListener('input', () => {
          if (confirmPass.value && pass.value !== confirmPass.value) {
            showFieldError(confirmPass, confirmFeedback, 'Passwords do not match.');
          } else {
            clearFieldError(confirmPass, confirmFeedback);
          }
        });
      }

      if (terms) {
        terms.addEventListener('change', () => {
          if (terms.checked) {
            clearFieldError(terms, termsFeedback);
          }
        });
      }

      // --- Form Submission Validation ---
      if (regForm) {
        regForm.addEventListener('submit', (e) => {
          e.preventDefault();
          let isValid = true;
          let firstInvalid = null;

          // 1. Full Name
          const nameVal = fullName ? fullName.value.trim() : '';
          if (!nameVal || nameVal.length < 2) {
            showFieldError(fullName, nameFeedback, 'Please enter your full name (at least 2 characters).');
            isValid = false;
            if (!firstInvalid) firstInvalid = fullName;
          } else if (/^\d+$/.test(nameVal)) {
            showFieldError(fullName, nameFeedback, 'Full name cannot contain only numbers.');
            isValid = false;
            if (!firstInvalid) firstInvalid = fullName;
          } else {
            clearFieldError(fullName, nameFeedback);
          }

          // 2. Email Address
          const emailVal = email ? email.value.trim() : '';
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailVal || !emailRegex.test(emailVal)) {
            showFieldError(email, emailFeedback, 'Please enter a valid email address.');
            isValid = false;
            if (!firstInvalid) firstInvalid = email;
          } else {
            clearFieldError(email, emailFeedback);
          }

          // 3. Mobile Phone
          const phoneVal = phone ? phone.value.trim() : '';
          const digits = phoneVal.replace(/\D/g, '');
          if (!phoneVal) {
            showFieldError(phone, phoneFeedback, 'Please enter your mobile phone number.');
            isValid = false;
            if (!firstInvalid) firstInvalid = phone;
          } else if (/[a-zA-Z]/.test(phoneVal)) {
            showFieldError(phone, phoneFeedback, 'Alphabets are not allowed. Please enter digits only.');
            isValid = false;
            if (!firstInvalid) firstInvalid = phone;
          } else if (digits.length < 7 || digits.length > 15) {
            showFieldError(phone, phoneFeedback, 'Please enter a valid phone number (7 to 15 digits).');
            isValid = false;
            if (!firstInvalid) firstInvalid = phone;
          } else {
            clearFieldError(phone, phoneFeedback);
          }

          // 4. Passwords
          const passVal = pass ? pass.value : '';
          const confirmVal = confirmPass ? confirmPass.value : '';
          if (!passVal || passVal.length < 8) {
            showFieldError(pass, passFeedback, 'Password must be at least 8 characters.');
            isValid = false;
            if (!firstInvalid) firstInvalid = pass;
          } else {
            clearFieldError(pass, passFeedback);
          }

          if (passVal !== confirmVal) {
            showFieldError(confirmPass, confirmFeedback, 'Passwords do not match. Please verify your passwords.');
            isValid = false;
            if (!firstInvalid) firstInvalid = confirmPass;
          } else {
            clearFieldError(confirmPass, confirmFeedback);
          }

          // 5. Terms
          if (terms && !terms.checked) {
            showFieldError(terms, termsFeedback, 'You must agree to the Cold Chain Transit Protocol and Terms.');
            isValid = false;
            if (!firstInvalid) firstInvalid = terms;
          } else if (terms) {
            clearFieldError(terms, termsFeedback);
          }

          if (!isValid) {
            if (firstInvalid && typeof firstInvalid.focus === 'function') {
              firstInvalid.focus();
            }
            if (window.showToast) {
              window.showToast('Please correct the highlighted errors before proceeding.', 'error');
            }
            return;
          }

          // Successful Registration
          if (window.showToast) {
            window.showToast('Account created successfully! Welcome to the Prime & Cut counter.', 'success');
          } else {
            alert('Account created successfully! Welcome to the Prime & Cut counter.');
          }
          setTimeout(() => {
            window.location.href = 'products.html';
          }, 1200);
        });
      }
    });
  </script>
</body>
</html>
