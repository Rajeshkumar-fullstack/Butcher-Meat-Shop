<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient matching Navbar Logo Badge -->
    <linearGradient id="navbarBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="45%" stop-color="#8B1E1E"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E1E"/>
      <stop offset="100%" stop-color="#5E1212"/>
    </linearGradient>
    <!-- Gold Gradient -->
    <linearGradient id="goldStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Navbar-Style Rounded Square Container -->
  <rect x="2" y="2" width="96" height="96" rx="24" ry="24" fill="url(#navbarBadgeGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Centered Scaled Cleaver & Shield Emblem -->
  <g transform="translate(50, 50) scale(0.68) translate(-50, -50)">
    <!-- Shield / Teardrop Pin -->
    <path d="M50,4 C72,4 90,14 90,36 C90,66 50,96 50,96 C50,96 10,66 10,36 C10,14 28,4 50,4 Z" fill="url(#shieldFillGrad)" stroke="url(#goldStrokeGrad)" stroke-width="4.5"/>
    
    <!-- Cleaver Icon -->
    <g transform="translate(32, 28) rotate(-15)">
      <!-- Blade -->
      <path d="M0,4 C0,1.8 1.8,0 4,0 L30,0 C32,0 34,1.8 34,4 L32,24 C32,26 30,28 28,28 L0,28 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
      <!-- Hanging Hole -->
      <circle cx="26" cy="7" r="2.8" fill="#8B1E1E"/>
      <!-- Brass/Gold Handle -->
      <path d="M-2,8 L-12,8 C-14,8 -16,10 -16,12 L-16,16 C-16,18 -14,20 -12,20 L-2,20 Z" fill="url(#goldStrokeGrad)"/>
    </g>
  </g>
</svg>
